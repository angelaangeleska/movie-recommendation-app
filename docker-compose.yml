version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./catalog-service
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
    networks:
      - app-network

  recommendation-service:
    build: ./recommendation-service
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    networks:
      - app-network

  frontend:
    build: ./frontend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - user-service
      - catalog-service
      - recommendation-service

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: movie-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: your-dockerhub-username/movie-catalog-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TMDB_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5

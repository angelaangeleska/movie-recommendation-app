apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: movie-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: your-dockerhub-username/movie-recommendation-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: TMDB_API_KEY
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5

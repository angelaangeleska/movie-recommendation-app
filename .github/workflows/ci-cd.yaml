name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-user-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-user-service:${{ github.sha }}

      - name: Build catalog-service
        uses: docker/build-push-action@v5
        with:
          context: ./catalog-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-catalog-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-catalog-service:${{ github.sha }}

      - name: Build recommendation-service
        uses: docker/build-push-action@v5
        with:
          context: ./recommendation-service
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-recommendation-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-recommendation-service:${{ github.sha }}

      - name: Build frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/movie-frontend:${{ github.sha }}

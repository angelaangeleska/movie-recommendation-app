events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:3001;
    }
    upstream catalog_service {
        server catalog-service:3002;
    }
    upstream recommendation_service {
        server recommendation-service:3003;
    }
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        # Block internal routes from being accessed externally
        location /internal/ {
            return 403;
        }

        location /api/auth/ {
            proxy_pass http://user_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users/ {
            proxy_pass http://user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/movies/tv/ {
            proxy_pass http://catalog_service/tv/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/movies/ {
            proxy_pass http://catalog_service/movies/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/recommendations {
            rewrite ^/api/recommendations(/.*)?$ /recommendations$1 break;
            proxy_pass http://recommendation_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
